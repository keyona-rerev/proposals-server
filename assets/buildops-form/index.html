<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- BuildOps copy of keyona-rerev/forms-engine form/index.html. Same Apps Script backend and Sheet.
     Changes from the shared page: stronger control borders (--edge), "Question N of total" label, single-choice answers no longer auto-advance,
     buttons say Next and "Send my answers", and a "Sending" message shows while the final save runs. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Form</title>
<style>
:root{--bg:#F0F7F7;--text:#0D1F2D;--accent:#1A9E9E;--on-accent:#fff;--muted:color-mix(in srgb,var(--text) 72%,var(--bg));--line:color-mix(in srgb,var(--text) 22%,transparent);--edge:color-mix(in srgb,var(--text) 65%,var(--bg));--card:color-mix(in srgb,var(--text) 6%,var(--bg));--err:#B42318;--font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:18px;line-height:1.5;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
#bar{position:fixed;top:0;left:0;right:0;height:4px;background:color-mix(in srgb,var(--text) 10%,transparent);z-index:5}
#barfill{height:100%;width:0;background:var(--accent);transition:width .35s ease}
#top{display:flex;align-items:center;justify-content:space-between;padding:20px max(20px,env(safe-area-inset-left));min-height:72px}
#logo{max-height:36px;max-width:160px}
#back{font:inherit;background:none;border:1px solid var(--edge);color:var(--text);border-radius:10px;min-width:44px;min-height:44px;cursor:pointer;font-size:18px}
#back[hidden]{display:none}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 20px 40px}
.screen{width:100%;max-width:720px;animation:up .35s ease both}
.screen.back{animation-name:down}
@keyframes up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes down{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}
.qnum{color:var(--accent);font-weight:700;margin-bottom:6px;font-size:16px}
.label{font-size:clamp(1.5rem,4.2vw,2.25rem);line-height:1.2;margin:0 0 8px;font-weight:600;outline:none}
.req{color:var(--err);margin-left:4px}
.desc{color:var(--muted);margin:0 0 24px;font-size:1rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.line{width:100%;font:inherit;font-size:clamp(1.25rem,3.4vw,1.75rem);color:var(--text);background:transparent;border:0;border-bottom:2px solid var(--edge);padding:8px 0;border-radius:0;outline:none}
.line:focus{border-bottom-color:var(--accent)}
textarea.line{border:2px solid var(--edge);border-radius:10px;padding:12px;font-size:1.1rem;resize:vertical;min-height:130px}
select.line{border:2px solid var(--edge);border-radius:10px;padding:12px;font-size:1.1rem;background:var(--bg)}
.line::placeholder{color:color-mix(in srgb,var(--text) 45%,var(--bg))}
.choices{display:grid;gap:10px}
.choices.pics{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.choice{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;text-align:left;font:inherit;font-size:1.05rem;color:var(--text);background:var(--card);border:2px solid var(--edge);border-radius:10px;padding:10px 14px;cursor:pointer}
.choice:hover{border-color:var(--accent)}
.choice[aria-checked=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--bg))}
.choice .key{display:inline-grid;place-items:center;min-width:26px;height:26px;border:1px solid var(--edge);border-radius:6px;font-size:.8rem;font-weight:700;background:var(--bg)}
.choice[aria-checked=true] .key{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.choice.pic{flex-direction:column;align-items:stretch;padding:8px}
.choice.pic img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;background:var(--line)}
.choice.pic .row{display:flex;gap:8px;align-items:center}
.other{margin-top:10px}
.stars,.scale{display:flex;flex-wrap:wrap;gap:8px}
.star{font-size:2.2rem;line-height:1;background:none;border:0;cursor:pointer;color:var(--line);min-width:44px;min-height:48px;padding:0}
.star.on{color:var(--accent)}
.num{min-width:48px;min-height:48px;font:inherit;font-weight:600;color:var(--text);background:var(--card);border:2px solid var(--line);border-radius:10px;cursor:pointer}
.num:hover{border-color:var(--accent)}
.num[aria-checked=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-top:8px}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rank-item{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px 12px;cursor:grab}
.rank-item.drag{opacity:.5}
.rank-item .grip{color:var(--muted)}
.rank-item .n{font-weight:700;color:var(--accent);min-width:1.4em}
.rank-item .txt{flex:1}
.rank-item .mv{display:flex;gap:4px}
.rank-item .mv button{min-width:44px;min-height:44px;font:inherit;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.rank-item .mv button:disabled{opacity:.35;cursor:default}
.mrow{border:0;padding:0;margin:0 0 16px}
.mrow legend{font-weight:600;margin-bottom:8px;padding:0}
.mopts{display:flex;flex-wrap:wrap;gap:8px}
.pill input{position:absolute;opacity:0;pointer-events:none}
.pill span{display:inline-block;padding:10px 16px;min-height:44px;border:2px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer}
.pill input:checked+span{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.pill input:focus-visible+span{outline:3px solid var(--text);outline-offset:2px}
canvas.sig{width:100%;height:180px;background:#fff;border:2px solid var(--line);border-radius:10px;touch-action:none;display:block}
.drop{display:block;border:2px dashed var(--line);border-radius:10px;padding:28px;text-align:center;cursor:pointer;background:var(--card)}
.drop:hover,.file-in:focus+.drop{border-color:var(--accent)}
.file-in{position:absolute;opacity:0;width:1px;height:1px}
.file-status{margin-top:10px;color:var(--muted);min-height:1.5em}
.actions{display:flex;align-items:center;gap:16px;margin-top:28px;flex-wrap:wrap}
.btn,.ok{font:inherit;font-weight:600;font-size:1.05rem;min-height:48px;padding:10px 22px;border-radius:10px;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.secondary{background:transparent;color:var(--text)}
.desc a{color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px;word-break:break-word}
.linkbtn{margin-top:4px}
.btn:disabled,.ok:disabled{opacity:.6;cursor:wait}
.hint{color:var(--muted);font-size:.9rem}
@media (hover:none),(max-width:640px){.hint{display:none}}
.err{color:var(--err);margin-top:14px;font-weight:600;min-height:1.2em}
.banner{position:fixed;bottom:0;left:0;right:0;background:var(--text);color:var(--bg);text-align:center;padding:8px;font-size:.9rem;z-index:6}
.check{width:72px;height:72px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:2.2rem;margin-bottom:20px}
.outcome{width:100%;max-width:560px;margin:16px auto 0;background:#fff;color:#0D1F2D;border:1px solid var(--line);border-top:6px solid var(--accent);border-radius:16px;padding:clamp(24px,6vw,40px);animation:up .35s ease both}
.outcome .chip{display:inline-block;font-size:.78rem;line-height:1.2;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px;border-radius:999px;margin:0 0 18px;background:color-mix(in srgb,var(--accent) 18%,#fff);color:#0D1F2D}
.outcome .label{font-size:clamp(1.6rem,6vw,2.1rem);margin:0 0 14px;color:#0D1F2D;overflow-wrap:anywhere}
.outcome .desc{font-size:1.06rem;line-height:1.65;color:#3D5166;margin:0 0 14px;overflow-wrap:anywhere}
.outcome .desc a{color:#0D7E7E}
.outcome .desc:last-child{margin-bottom:0}
.outcome .btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;margin-top:22px;padding:14px 24px;font-size:1.12rem;text-align:center;border-radius:12px}
.outcome .btn:focus-visible{outline:3px solid #0D1F2D;outline-offset:3px}
.hp-wrap{position:absolute;left:-9999px;top:-9999px;height:0;overflow:hidden}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.screen,#barfill{animation:none;transition:none}}
</style>
</head>
<body>
<div id="bar" role="progressbar" aria-label="Form progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="barfill"></div></div>
<header id="top"><img id="logo" alt="" hidden><button id="back" type="button" aria-label="Previous question" hidden>&#8593;</button></header>
<main id="stage"><noscript>This form needs JavaScript.</noscript></main>
<div class="hp-wrap" aria-hidden="true"><label>Website<input class="hp" name="website" tabindex="-1" autocomplete="off"></label></div>
<script>
(function () {
'use strict';
// The setup wizard replaces this value with your Apps Script web app URL.
const API_BASE = 'https://script.google.com/macros/s/AKfycbw-BskXkxcU5T8EDT34iCODIiu88eUslcSGkfxbHBdM6yBUZ7WjVe1f11834SEjZUuH0Q/exec';
const sp = new URLSearchParams(location.search);
const FORM_ID = (sp.get('f') || '').trim();
const PREVIEW_KEY = sp.get('key') || '';
const SK = 'rf:' + FORM_ID;
// Tracking data from the address (utm_*, fbclid, landing_page, referrer). Anything that is not f, key or a_*. Sent with every save.
const META = {};
sp.forEach((val, key) => {
  if (key === 'f' || key === 'key' || key.indexOf('a_') === 0) return;
  if (!/^[a-z0-9_]{1,40}$/i.test(key) || Object.keys(META).length >= 12) return;
  META[key] = String(val).slice(0, 300);
});
let startSent = false;
function notifyStart() {
  if (startSent || window.parent === window) return; startSent = true;
  try { window.parent.postMessage({ type: 'rerev-form-start', formId: FORM_ID }, '*'); } catch (e) {}
}
const LAYOUT = { welcome: 1, statement: 1 };
const LET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const stage = document.getElementById('stage');

let form = null, qs = [], idx = 0, answers = {}, trail = [], sid = newSid();
let preview = false, done = false, widget = null, busy = false, saveTimer = null;

function newSid() {
  const a = new Uint8Array(16); crypto.getRandomValues(a);
  return Array.from(a, b => (b % 36).toString(36)).join('') + Date.now().toString(36);
}
function h(tag, a, ...kids) {
  const e = document.createElement(tag);
  if (a) for (const k in a) {
    const v = a[k]; if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(3)) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}
function pipe(t) {
  return String(t || '').replace(/\{\{\s*([\w-]+)\s*\}\}/g, (m, k) => {
    const v = answers[k]; return v == null ? '' : Array.isArray(v) ? v.join(', ') : typeof v === 'object' ? '' : String(v);
  });
}
// Turns http(s) addresses in plain text into safe links. No innerHTML. Other schemes never become links.
function linkify(text) {
  const s = String(text == null ? '' : text), out = [], re = /https?:\/\/[^\s<>"']+/gi;
  let last = 0, m;
  while ((m = re.exec(s))) {
    let url = m[0], tail = '';
    while (/[.,;:!?)\]]$/.test(url)) { tail = url.slice(-1) + tail; url = url.slice(0, -1); }
    if (m.index > last) out.push(s.slice(last, m.index));
    out.push(h('a', { href: url, target: '_blank', rel: 'noopener noreferrer' }, url));
    if (tail) out.push(tail);
    last = m.index + m[0].length;
  }
  if (last < s.length) out.push(s.slice(last));
  return out;
}
async function post(body) {
  const r = await fetch(API_BASE, { method: 'POST', body: JSON.stringify(body) });
  return r.json();
}

/* ---------- load ---------- */
async function init() {
  if (!FORM_ID) return msg('No form selected', 'Add ?f=FORM_ID to the web address.');
  if (API_BASE.indexOf('__') === 0) return msg('Not set up yet', 'This page has no backend address. Run the setup wizard.');
  let res;
  try {
    const u = API_BASE + '?action=form&id=' + encodeURIComponent(FORM_ID) + (PREVIEW_KEY ? '&key=' + encodeURIComponent(PREVIEW_KEY) : '');
    res = await (await fetch(u)).json();
  } catch (e) { return msg('Could not load the form', 'Check your connection.', init); }
  if (!res || !res.ok) {
    if (res && res.error === 'closed') return msg(res.title || 'Form closed', 'This form is not accepting responses.');
    return msg('Form not found', 'Check the link and try again.');
  }
  form = res.form; preview = !!res.preview; qs = res.questions.slice();
  document.title = form.title;
  theme();
  if (!qs.length) return msg(form.title, 'This form has no questions yet.');
  if (qs[0].type !== 'welcome' && (form.welcomeTitle || form.welcomeText)) {
    qs.unshift({ id: '__welcome', type: 'welcome', label: form.welcomeTitle || form.title, description: form.welcomeText, logic: [], options: [], rows: [] });
  }
  if (preview) { document.body.append(h('div', { class: 'banner', role: 'status' }, 'Preview mode. Nothing is saved.')); }
  else restore();
  // Prefill: ?a_q_tool=linktree picks the option whose text starts with, or contains "(replaces linktree)". Unknown values are ignored.
  sp.forEach((val, key) => {
    if (key.indexOf('a_') !== 0) return;
    const id = key.slice(2), q = qs.find(x => x.id === id), v = String(val).toLowerCase().trim();
    if (!q || !v || answers[id]) return;
    const o = (q.options || []).find(x => x.toLowerCase().indexOf(v) === 0 || x.toLowerCase().indexOf('(replaces ' + v + ')') > -1);
    if (o) answers[id] = o;
  });
  show(idx, 'fwd');
}
function lum(hex) {
  let c = hex.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join('');
  const n = parseInt(c.slice(0, 6), 16), f = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); };
  return .2126 * f(n >> 16 & 255) + .7152 * f(n >> 8 & 255) + .0722 * f(n & 255);
}
function theme() {
  const r = document.documentElement.style, t = form.theme;
  r.setProperty('--bg', t.bg); r.setProperty('--text', t.text); r.setProperty('--accent', t.accent);
  r.setProperty('--on-accent', lum(t.accent) > .4 ? '#0D1F2D' : '#fff');
  const f = String(form.font || '').replace(/[^A-Za-z0-9 ]/g, '').trim();
  if (f) {
    document.head.append(h('link', { rel: 'stylesheet', href: 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(f).replace(/%20/g, '+') + ':wght@400;600;700&display=swap' }));
    r.setProperty('--font', "'" + f + "',system-ui,sans-serif");
  }
  if (form.logoUrl) { const l = document.getElementById('logo'); l.src = form.logoUrl; l.hidden = false; }
}
function msg(title, text, retry) {
  stage.replaceChildren(h('section', { class: 'screen' }, h('h1', { class: 'label' }, title), h('p', { class: 'desc' }, text),
    retry ? h('button', { class: 'btn', type: 'button', onclick: retry }, 'Try again') : null));
}

/* ---------- navigation ---------- */
function nonLayoutNumber(i) { let n = 0; for (let k = 0; k <= i; k++) if (!LAYOUT[qs[k].type]) n++; return n; }
function progress() {
  const p = done ? 100 : Math.round(trail.length / Math.max(1, qs.length) * 100);
  document.getElementById('barfill').style.width = p + '%';
  document.getElementById('bar').setAttribute('aria-valuenow', p);
}
function show(i, dir) {
  idx = i; const qn = qs[i], last = isLast(i);
  widget = (W[qn.type] || W.short_text)(qn, answers[qn.id]);
  const lay = !!LAYOUT[qn.type];
  const btnText = last ? 'Send my answers' : qn.type === 'welcome' ? (form.startButton || 'Start') : lay ? 'Continue' : 'Next';
  const ok = h('button', { class: 'ok', type: 'button', onclick: next }, btnText);
  const scr = h('section', { class: 'screen' + (dir === 'back' ? ' back' : ''), 'aria-labelledby': 'lbl' },
    lay ? null : h('div', { class: 'qnum' }, 'Question ' + nonLayoutNumber(i) + ' of ' + qs.filter(x => !LAYOUT[x.type]).length),
    h('h1', { class: 'label', id: 'lbl', tabindex: '-1' }, pipe(qn.label), qn.required && !lay ? [h('span', { class: 'req', 'aria-hidden': 'true' }, '*'), h('span', { class: 'sr' }, ' (required)')] : null),
    qn.description ? h('p', { class: 'desc', id: 'desc' }, linkify(pipe(qn.description))) : null,
    widget.el,
    h('div', { class: 'err', id: 'err', role: 'alert' }),
    h('div', { class: 'actions' }, ok, h('span', { class: 'hint' }, 'press Enter ↵')));
  stage.replaceChildren(scr);
  document.getElementById('back').hidden = !trail.length;
  progress();
  if (widget.mount) widget.mount();
  setTimeout(() => { const f = widget.focus ? widget.focus : null; if (f && !LAYOUT[qn.type]) f(); else document.getElementById('lbl').focus({ preventScroll: true }); }, 60);
}
function isLast(i) { return nextIndex(i) >= qs.length; }
function matches(r) {
  if (r.q === '*') return true;
  const a = answers[r.q], arr = Array.isArray(a) ? a.map(x => String(x).toLowerCase()) : null;
  const s = a == null ? '' : String(a).toLowerCase(), v = String(r.val).toLowerCase();
  switch (r.op) {
    case '=': return arr ? arr.includes(v) : s === v;
    case '!=': return arr ? !arr.includes(v) : s !== v;
    case 'contains': return arr ? arr.some(x => x.includes(v)) : s.includes(v);
    case '>': return s !== '' && Number(s) > Number(v);
    case '<': return s !== '' && Number(s) < Number(v);
    case '>=': return s !== '' && Number(s) >= Number(v);
    case '<=': return s !== '' && Number(s) <= Number(v);
  }
  return false;
}
function nextIndex(i) {
  for (const r of qs[i].logic || []) {
    if (!matches(r)) continue;
    if (r.goto === 'end') return qs.length;
    const j = qs.findIndex(x => x.id === r.goto);
    if (j > i) return j; // forward jumps only, so a loop is impossible
  }
  return i + 1;
}
function setErr(t) { const e = document.getElementById('err'); if (e) e.textContent = t || ''; }
async function next() {
  if (busy || done) return; busy = true; setErr('');
  const ok = document.querySelector('.ok'); if (ok) ok.disabled = true;
  try {
    const qn = qs[idx];
    if (!LAYOUT[qn.type]) {
      const val = await widget.get(), err = validate(qn, val);
      if (err) { setErr(err); if (widget.focus) widget.focus(); return; }
      answers[qn.id] = val;
      if (!preview) notifyStart();
    }
    const n = nextIndex(idx);
    if (n >= qs.length) { if (!(await submit())) return; trail.push(idx); return; }
    trail.push(idx); persist(n); queueSave(); show(n, 'fwd');
  } catch (e) { setErr(e.message || 'Something went wrong. Try again.'); }
  finally { busy = false; const o = document.querySelector('.ok'); if (o) o.disabled = false; }
}
function back() { if (!trail.length || busy || done) return; const i = trail.pop(); persist(i); show(i, 'back'); }
document.getElementById('back').addEventListener('click', back);

/* ---------- validation ---------- */
function validate(qn, v) {
  const empty = v == null || v === '' || (Array.isArray(v) && !v.length) || (typeof v === 'object' && !Array.isArray(v) && !Object.keys(v).length);
  if (empty) return qn.required ? (qn.type === 'legal' ? 'You need to accept to continue.' : 'Please answer this question.') : '';
  switch (qn.type) {
    case 'email': return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v) ? '' : 'Enter a valid email address.';
    case 'phone': return /^[+()\d\s.\-x]+$/i.test(v) && String(v).replace(/\D/g, '').length >= 7 ? '' : 'Enter a valid phone number.';
    case 'url': try { new URL(v); return ''; } catch (e) { return 'Enter a valid web address.'; }
    case 'number': {
      const n = Number(v); if (isNaN(n)) return 'Enter a number.';
      if (qn.min != null && n < qn.min) return 'Enter a number of ' + qn.min + ' or more.';
      if (qn.max != null && n > qn.max) return 'Enter a number of ' + qn.max + ' or less.'; return '';
    }
    case 'checkbox': case 'picture_choice': {
      const a = Array.isArray(v) ? v : [v];
      if (qn.min != null && a.length < qn.min) return 'Choose at least ' + qn.min + '.';
      if (qn.type === 'checkbox' && qn.max != null && a.length > qn.max) return 'Choose at most ' + qn.max + '.'; return '';
    }
    case 'matrix': return qn.required && Object.keys(v).length < qn.rows.length ? 'Answer every row.' : '';
  }
  return '';
}

/* ---------- save ---------- */
function ids() { return trail.map(i => qs[i].id); }
function pick(list) { const o = {}; list.forEach(id => { if (id in answers) o[id] = answers[id]; }); return o; }
function partialPayload() { const v = ids(); return { action: 'save', formId: FORM_ID, sessionId: sid, answers: pick(v), visited: v, complete: false, meta: META }; }
function queueSave() {
  if (preview || done || !Object.keys(pick(ids())).length) return; clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { post(partialPayload()).catch(() => {}); }, 500);
}
addEventListener('pagehide', () => {
  if (preview || done || !Object.keys(pick(ids())).length) return;
  try { navigator.sendBeacon(API_BASE, new Blob([JSON.stringify(partialPayload())], { type: 'text/plain' })); } catch (e) {}
});
async function submit() {
  const v = [...trail, idx].map(i => qs[i].id);
  if (preview) { finish(); return true; }
  setErr('Sending your answers. This can take a few seconds.');
  try {
    const r = await post({ action: 'save', formId: FORM_ID, sessionId: sid, answers: pick(v), visited: v, complete: true, meta: META, hp: (document.querySelector('.hp') || {}).value || '' });
    if (r.ok) { finish(r.result); return true; }
    if (r.error === 'required') { const j = qs.findIndex(x => x.id === r.questionId); if (j >= 0) { show(j, 'back'); setErr('This question is required.'); } return false; }
    if (r.error === 'closed') { msg('Form closed', 'This form is no longer accepting responses.'); return false; }
    setErr('We could not save your answers. Try again.');
  } catch (e) { setErr('No connection. Your answers are kept. Try again.'); }
  return false;
}
// Picks white or ink text for a button, whichever has the higher contrast ratio against the accent.
function onAccent(hex) {
  const l = lum(hex), w = 1.05 / (l + .05), d = (l + .05) / (lum('#0D1F2D') + .05);
  return w >= d ? '#fff' : '#0D1F2D';
}
const CHIP = { qualified: 'Approved', review: 'Under review', not_fit: 'Application received' };
// Tells a page that embeds this form how tall the result card is, so the iframe fits it with no inner scrollbar.
function reportHeight(card, outcome) {

  const send = () => {
    const top = document.getElementById('top'), cs = getComputedStyle(stage);
    // 56px of room under the card keeps host badges (for example Netlify's "Powered by" pill) from covering it.
    const hgt = Math.ceil(top.offsetHeight + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) + card.offsetHeight + parseFloat(getComputedStyle(card).marginTop) + 56);
    try { window.parent.postMessage({ type: 'rerev-form-outcome', formId: FORM_ID, height: hgt, status: 'complete', outcome: outcome || '' }, '*'); } catch (e) {}
  };
  send();
  if (window.ResizeObserver) new ResizeObserver(send).observe(card);
  else addEventListener('resize', send);
}
function finish(result) {
  const rs = result && result.title ? result : null;
  const rsUrl = rs && /^https:\/\//i.test(String(rs.buttonUrl || '')) ? rs.buttonUrl : '';
  done = true; clearTimeout(saveTimer); try { sessionStorage.removeItem(SK); } catch (e) {}
  progress(); document.getElementById('back').hidden = true;
  if (rs) {
    // Result card. Built with DOM calls only, so the server text can never run as HTML.
    const paras = String(rs.text == null ? '' : rs.text).split(/\n{2,}/).filter(Boolean);
    const card = h('section', { class: 'outcome', 'aria-labelledby': 'lbl', style: '--on-accent:' + onAccent(form.theme.accent) },
      CHIP[rs.status] ? h('div', { class: 'chip' }, CHIP[rs.status]) : null,
      h('h1', { class: 'label', id: 'lbl', tabindex: '-1' }, rs.title),
      paras.map(p => h('p', { class: 'desc' }, linkify(p))),
      rsUrl ? h('a', { class: 'btn', href: rsUrl, target: '_blank', rel: 'noopener noreferrer' }, rs.buttonLabel || 'Continue') : null);
    stage.replaceChildren(card);
    if (window.parent !== window) document.getElementById('top').style.display = 'none'; // no empty header strip inside an embed
    reportHeight(card, rs.status);
  } else {
    stage.replaceChildren(h('section', { class: 'screen' }, h('div', { class: 'check', 'aria-hidden': 'true' }, '✓'),
      h('h1', { class: 'label', id: 'lbl', tabindex: '-1' }, form.thankYouTitle), h('p', { class: 'desc' }, linkify(pipe(form.thankYouText))),
      form.redirectUrl ? h('a', { class: 'btn', href: form.redirectUrl }, 'Continue') : null));
    if (!preview && stage.firstChild) reportHeight(stage.firstChild, '');
  }
  document.getElementById('lbl').focus({ preventScroll: true });
  if (!rs && form.redirectUrl && !preview) setTimeout(() => { location.href = form.redirectUrl; }, 5000);
}
function persist(n) { if (preview) return; try { sessionStorage.setItem(SK, JSON.stringify({ sid, answers, trail, idx: n })); } catch (e) {} }
function restore() {
  try {
    const s = JSON.parse(sessionStorage.getItem(SK) || 'null');
    if (s && s.sid) { sid = s.sid; answers = s.answers || {}; trail = (s.trail || []).filter(i => i < qs.length); idx = Math.min(s.idx || 0, qs.length - 1); }
  } catch (e) {}
}

/* ---------- uploads ---------- */
function fileToB64(f) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = () => rej(new Error('Could not read that file.')); r.readAsDataURL(f); });
}
async function uploadB64(qn, name, mime, b64) {
  if (preview) return 'preview-not-saved';
  const r = await post({ action: 'upload', formId: FORM_ID, sessionId: sid, questionId: qn.id, fileName: name, mime: mime, data: b64 });
  if (!r.ok) throw new Error(r.error === 'too_large' ? 'That file is too large. The limit is 15 MB.' : r.error === 'file_type_blocked' ? 'That file type is not allowed.' : r.error === 'storage_unavailable' ? 'File uploads are not working right now. Please tell the form owner.' : 'Upload failed. Try again.');
  return r.url;
}

/* ---------- widgets ---------- */

W.statement = (qn) => qn.link
  ? { el: h('div', { class: 'linkbtn' }, h('a', { class: 'btn', href: qn.link, target: '_blank', rel: 'noopener noreferrer' }, qn.placeholder || 'Open link')), get: () => null }
  : W.welcome();
W.dropdown = (qn, cur) => {
  const s = h('select', { class: 'line', id: 'in', 'aria-labelledby': 'lbl' }, h('option', { value: '' }, 'Choose an option'), qn.options.map(o => h('option', { value: o }, o)));
  s.value = cur || '';
  return { el: s, get: () => s.value, focus: () => s.focus() };
};
W.yes_no = (qn, cur) => {
  let v = cur || ''; const bs = ['Yes', 'No'].map(t => h('button', { type: 'button', role: 'radio', class: 'choice', 'aria-checked': String(v === t) }, h('span', { class: 'key' }, t[0]), h('span', null, t)));
  const set = i => { v = ['Yes', 'No'][i]; bs.forEach((b, k) => b.setAttribute('aria-checked', String(k === i))); setTimeout(next, 300); };
  bs.forEach((b, i) => b.addEventListener('click', () => set(i)));
  return { el: h('div', { class: 'choices', role: 'radiogroup', 'aria-labelledby': 'lbl' }, bs), get: () => v, focus: () => bs[0].focus(), key: c => { const k = c.toUpperCase(); if (k === 'Y') set(0); if (k === 'N') set(1); } };
};
function choices(qn, cur, multi, pic) {
  const opts = qn.options.map(raw => {
    let label = raw, img = '', other = false;
    if (pic) { const p = raw.split('~'); label = p[0].trim(); img = /^https:\/\//i.test((p[1] || '').trim()) ? p[1].trim() : ''; }
    else if (/\*$/.test(raw)) { label = raw.slice(0, -1).trim(); other = true; }
    return { label, img, other };
  });
  const sel = new Set(), have = Array.isArray(cur) ? cur : cur ? [cur] : [];
  let otherVal = ''; const oi = opts.findIndex(o => o.other);
  have.forEach(x => { const k = opts.findIndex(o => o.label === x); if (k >= 0) sel.add(k); else if (oi >= 0) { sel.add(oi); otherVal = x; } });
  const otherIn = h('input', { class: 'line other', placeholder: 'Type your answer', maxlength: 200, 'aria-label': 'Other answer', hidden: true });
  otherIn.value = otherVal;
  const bs = opts.map((o, i) => h('button', { type: 'button', role: multi ? 'checkbox' : 'radio', class: 'choice' + (pic ? ' pic' : ''), 'aria-checked': 'false' },
    pic && o.img ? h('img', { src: o.img, alt: '', loading: 'lazy' }) : null,
    h('span', { class: 'row' }, h('span', { class: 'key' }, LET[i] || ''), h('span', { class: 'txt' }, o.label))));

    }
  };

    multi, el: h('div', null, h('div', { class: pic ? 'choices pics' : 'choices', role: multi ? 'group' : 'radiogroup', 'aria-labelledby': 'lbl' }, bs), otherIn),
    get: () => { const out = [...sel].sort((a, b) => a - b).map(i => opts[i].other ? (otherIn.value.trim() || opts[i].label) : opts[i].label); return multi ? out : out[0] || ''; },

W.multiple_choice = (qn, cur) => choices(qn, cur, false, false);
W.checkbox = (qn, cur) => choices(qn, cur, true, false);

};
function scale(qn, cur) {

  const set = i => { v = vals[i]; bs.forEach((b, j) => b.setAttribute('aria-checked', String(j === i))); setTimeout(next, 350); };
  bs.forEach((b, i) => b.addEventListener('click', () => set(i)));
  return { el: h('div', null, h('div', { class: 'scale', role: 'radiogroup', 'aria-labelledby': 'lbl' }, bs), (qn.left || qn.right) ? h('div', { class: 'ends' }, h('span', null, qn.left), h('span', null, qn.right)) : null),
    get: () => v == null ? '' : v, focus: () => bs[0].focus(), key: c => { if (/\d/.test(c)) { const i = vals.indexOf(Number(c)); if (i >= 0) set(i); } } };
}
W.opinion_scale = scale; W.nps = scale;
W.ranking = (qn, cur) => {
  let order = Array.isArray(cur) && cur.length === qn.options.length ? cur.slice() : qn.options.slice();
  const list = h('ol', { class: 'rank', 'aria-labelledby': 'lbl' });
  const mv = (i, d) => { const j = i + d; if (j < 0 || j >= order.length) return; [order[i], order[j]] = [order[j], order[i]]; paint(); const b = list.children[j].querySelectorAll('button'); (b[d < 0 && !b[0].disabled ? 0 : 1].disabled ? b[0] : b[d < 0 ? 0 : 1]).focus(); };
  function paint() {

      const li = h('li', { class: 'rank-item', draggable: 'true' }, h('span', { class: 'grip', 'aria-hidden': 'true' }, '⋮⋮'), h('span', { class: 'n' }, String(i + 1)), h('span', { class: 'txt' }, t),
        h('span', { class: 'mv' }, h('button', { type: 'button', 'aria-label': 'Move ' + t + ' up', disabled: i === 0, onclick: () => mv(i, -1) }, '↑'), h('button', { type: 'button', 'aria-label': 'Move ' + t + ' down', disabled: i === order.length - 1, onclick: () => mv(i, 1) }, '↓')));
      li.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', String(i)); li.classList.add('drag'); });
      li.addEventListener('dragend', () => li.classList.remove('drag'));
      li.addEventListener('dragover', e => e.preventDefault());
      li.addEventListener('drop', e => { e.preventDefault(); const from = Number(e.dataTransfer.getData('text/plain')); if (!isNaN(from) && from !== i) { const x = order.splice(from, 1)[0]; order.splice(i, 0, x); paint(); } });

};
W.matrix = (qn, cur) => {
  const val = Object.assign({}, cur || {});
  const el = h('div', { class: 'matrix' }, qn.rows.map((row, ri) => h('fieldset', { class: 'mrow' }, h('legend', null, row),
    h('div', { class: 'mopts' }, qn.options.map(col => {
      const id = 'm' + ri + '_' + col.replace(/\W/g, '_'), inp = h('input', { type: 'radio', name: 'm' + ri, id, value: col });
      if (val[row] === col) inp.checked = true; inp.addEventListener('change', () => { val[row] = col; });
      return h('label', { class: 'pill', for: id }, inp, h('span', null, col));
    })))));

};
W.legal = (qn, cur) => {
  let on = cur === 'Accepted';
  const b = h('button', { type: 'button', role: 'checkbox', class: 'choice', 'aria-checked': String(on) }, h('span', { class: 'key' }, '✓'), h('span', null, 'I accept'));
  b.addEventListener('click', () => { on = !on; b.setAttribute('aria-checked', String(on)); });
  return { el: b, get: () => on ? 'Accepted' : '', focus: () => b.focus(), multi: true };
};
W.payment = (qn, cur) => {
  let opened = !!cur;
  const a = h('a', { class: 'btn secondary', href: qn.link || '#', target: '_blank', rel: 'noopener noreferrer' }, 'Open payment page');
  a.addEventListener('click', () => { opened = true; });
  return { el: qn.link ? a : h('p', null, 'The payment link is missing.'), get: () => opened ? 'Payment page opened' : '' };
};
W.file_upload = (qn, cur) => {
  let url = typeof cur === 'string' ? cur : '', up = false;
  const inp = h('input', { type: 'file', id: 'fin', class: 'file-in' });
  const status = h('div', { class: 'file-status', 'aria-live': 'polite' }, url ? 'File uploaded.' : '');
  inp.addEventListener('change', async () => {
    const f = inp.files[0]; if (!f) return;
    if (f.size > 15 * 1024 * 1024) { status.textContent = 'That file is too large. The limit is 15 MB.'; inp.value = ''; return; }
    up = true; status.textContent = 'Uploading ' + f.name + '...';
    try { url = await uploadB64(qn, f.name, f.type, await fileToB64(f)); status.textContent = 'Uploaded: ' + f.name; }
    catch (e) { url = ''; status.textContent = e.message; }
    up = false;
  });
  return { el: h('div', null, inp, h('label', { class: 'drop', for: 'fin' }, 'Click to choose a file'), status), get: () => { if (up) throw new Error('Wait for the upload to finish.'); return url; }, focus: () => inp.focus() };
};
W.signature = (qn, cur) => {
  const c = h('canvas', { class: 'sig', role: 'img', 'aria-label': 'Signature area. Draw with a finger or mouse.' });
  let drawn = false, url = typeof cur === 'string' && cur.indexOf('http') === 0 ? cur : '', ctx, down = false;
  const note = h('div', { class: 'file-status' }, url ? 'Signature saved. Draw again to replace it.' : '');
  const clear = h('button', { type: 'button', class: 'btn secondary', onclick: () => { drawn = false; url = ''; note.textContent = ''; reset(); } }, 'Clear');
  function reset() { const r = devicePixelRatio || 1; c.width = c.clientWidth * r; c.height = c.clientHeight * r; ctx = c.getContext('2d'); ctx.scale(r, r); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.clientWidth, c.clientHeight); ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.strokeStyle = '#0D1F2D'; }
  const pt = e => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  c.addEventListener('pointerdown', e => { down = true; drawn = true; c.setPointerCapture(e.pointerId); const p = pt(e); ctx.beginPath(); ctx.moveTo(p[0], p[1]); });
  c.addEventListener('pointermove', e => { if (!down) return; const p = pt(e); ctx.lineTo(p[0], p[1]); ctx.stroke(); });
  ['pointerup', 'pointercancel'].forEach(t => c.addEventListener(t, () => { down = false; }));
  return {
    el: h('div', null, c, h('div', { class: 'actions' }, clear), note), mount: reset,
    get: async () => { if (drawn) { url = await uploadB64(qn, 'signature.png', 'image/png', c.toDataURL('image/png').split(',')[1]); drawn = false; } return url; }
  };
};

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (done || !widget || busy || e.isComposing) return;
  const t = e.target, tag = t.tagName;
  if (e.key === 'Enter') {
    if (tag === 'TEXTAREA' && e.shiftKey) return;
    if (tag === 'BUTTON' && t.classList.contains('choice') && widget.multi) { e.preventDefault(); next(); return; }
    if (tag === 'BUTTON' || tag === 'A' || tag === 'SELECT') return;
    e.preventDefault(); next(); return;
  }
  if (tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT' && !e.metaKey && !e.ctrlKey && !e.altKey && e.key.length === 1 && widget.key) widget.key(e.key);
});
